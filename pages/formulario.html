<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ingreso | Rostros de la Santidad Escolapia</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/formulario.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="../img/logo escolapio.png" alt="Escudo Escolapio" class="logo-img">
            <span class="tag-escolapio">3.º H — Equipo 2</span>
            <h1>Formulario de Ingreso</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">← Volver al Sitio</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page-container">
        <section class="form-card" id="form-container">
            <div class="form-header">
                <span class="badge">Registro</span>
                <h2>Formulario de Ingreso</h2>
                <p>Completa tus datos para formar parte de la comunidad de visitantes.</p>
            </div>

            <form action="#" method="POST" id="form-ingreso" class="custom-form">
                <div class="form-group">
                    <label for="nombre">Escribe tu nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Nicolás Abel" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="edad">¿Cuántos años tienes?</label>
                    <input type="number" id="edad" name="edad" placeholder="Ej: 15" min="1" max="120" required>
                </div>

                <div class="form-group">
                    <label for="pasatiempos">Pasatiempos:</label>
                    <textarea id="pasatiempos" name="pasatiempos" rows="4" placeholder="¿Qué te gusta hacer en tu tiempo libre? (deportes, lectura, música...)"></textarea>
                </div>

                <button type="submit" class="btn-primary btn-submit">Enviar Datos</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Proyecto Integrador: Taller de Informática y Catequesis — 3.º H (Equipo 2)</p>
        <p>Integrantes: Nicolás Abel y Tadeo Vilaboa</p>
    </footer>

    <script src="../js/formulario.js"></script>
</body>
</html>
